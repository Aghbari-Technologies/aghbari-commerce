title = "Aghbari Commerce Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Deterministic idempotency fixtures in dedicated test files"
condition = "AND"
regexTarget = "secret"
paths = [
  '''^supabase/tests/.*\.test\.sql$''',
  '''^src/.*\.test\.ts$''',
]
regexes = [
  '''^order-idem-adversarial-[0-9]+$''',
  '''^stock-count-idem-[0-9]+$''',
  '''^rbac-transition-[0-9]+$''',
  '''^r5-(purchase|receipt)-key-[0-9]+$''',
  '''^inventory-idempotency-[0-9]+$''',
  '''^purchase-idempotency-[0-9]+$''',
  '''^CONCURRENCY-IDEMPOTENCY-[0-9]+$''',
  '''^0123456789abcdef$''',
  '''^order-key-1234567890$''',
]

[[rules.allowlists]]
description = "Deterministic synthetic UUID fixtures in database proof tests"
condition = "AND"
regexTarget = "secret"
paths = [
  '''^supabase/tests/.*\.test\.sql$''',
]
regexes = [
  '''^67676767-6767-4676-8676-6767676767[0-9]{2}$''',
  '''^78787878-7878-4787-8787-7878787878[0-9]{2}$''',
  '''^eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee$''',
  '''^44444444-4444-4444-8444-444444444444$''',
  '''^88888888-8888-4888-8888-888888888888$''',
  '''^99999999-9999-4999-8999-999999999999$''',
]

[[rules.allowlists]]
description = "Deterministic concurrency proof tokens"
condition = "AND"
regexTarget = "secret"
paths = [
  '''^scripts/concurrency-matrix-proof\.sh$''',
  '''^scripts/concurrency-order-proof\.sh$''',
]
regexes = [
  '''^abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789$''',
  '''^CONCURRENCY-IDEMPOTENCY-20260911$''',
]

[allowlist]
description = "Do not scan this configuration file itself"
paths = [
  '''^\.gitleaks\.toml$''',
]
