name: supabase-migration-proof

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      exact_sha:
        description: 'Exact Git SHA to verify'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aghbari-migration-proof-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha || inputs.exact_sha }}
  cancel-in-progress: true

jobs:
  migration-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ inputs.exact_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Validate exact SHA input
        shell: bash
        run: echo "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.exact_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify exact target HEAD
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA" || {
            echo "EXACT HEAD MISMATCH: expected=$TARGET_SHA actual=$actual"
            exit 1
          }
          echo "EXACT MIGRATION PROOF HEAD: $actual"
      - name: Fail fast on duplicate migration versions
        shell: bash
        run: |
          versions="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]+)_.*/\1/' | sort)"
          duplicates="$(printf '%s\n' "$versions" | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            echo "Duplicate migration versions detected:"
            printf '%s\n' "$duplicates"
            exit 1
          fi
          echo "Migration version uniqueness: PASS"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start local Supabase
        run: supabase start
      - name: Apply migrations from empty database
        run: supabase db reset --local
      - name: Verify effective final order authority in Fresh DB
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase.env
          source /tmp/supabase.env
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            fn text;
            fn_count integer;
            auth_ok boolean;
            anon_ok boolean;
          BEGIN
            SELECT count(*) INTO fn_count
            FROM pg_proc p
            JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public'
              AND p.proname = 'create_order'
              AND pg_get_function_identity_arguments(p.oid) = 'p_idempotency_key text, p_warehouse_id uuid, p_lines jsonb';
            IF fn_count <> 1 THEN
              RAISE EXCEPTION 'effective create_order signature count=%', fn_count;
            END IF;

            SELECT pg_get_functiondef(p.oid) INTO fn
            FROM pg_proc p
            JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public'
              AND p.proname = 'create_order'
              AND pg_get_function_identity_arguments(p.oid) = 'p_idempotency_key text, p_warehouse_id uuid, p_lines jsonb';

            IF fn NOT LIKE '%pg_catalog.pg_advisory_xact_lock%' OR fn NOT LIKE '%v_requested_key%' THEN
              RAISE EXCEPTION 'effective create_order is missing same-key serialization';
            END IF;
            IF fn NOT LIKE '%c.organization_id = v_org%' OR fn NOT LIKE '%c.customer_id = v_customer%' OR fn NOT LIKE '%c.status = ''active''%' THEN
              RAISE EXCEPTION 'effective create_order is missing atomic active-cart lock';
            END IF;
            IF fn NOT LIKE '%SET status = ''converted'', updated_at = pg_catalog.now()%' THEN
              RAISE EXCEPTION 'effective create_order is missing atomic cart conversion';
            END IF;
            IF fn NOT LIKE '%idempotency key payload conflict%' OR fn NOT LIKE '%errcode=''40001''%' THEN
              RAISE EXCEPTION 'effective create_order is missing payload-conflict fail-closed contract';
            END IF;
            IF fn NOT LIKE '%SET search_path = ''''%' THEN
              RAISE EXCEPTION 'effective create_order is missing empty search_path';
            END IF;
            IF fn LIKE '%EXCEPTION WHEN unique_violation THEN%' THEN
              RAISE EXCEPTION 'effective create_order contains unsafe generic unique_violation success recovery';
            END IF;

            SELECT has_function_privilege('authenticated', 'public.create_order(text,uuid,jsonb)', 'EXECUTE') INTO auth_ok;
            SELECT has_function_privilege('anon', 'public.create_order(text,uuid,jsonb)', 'EXECUTE') INTO anon_ok;
            IF NOT auth_ok THEN
              RAISE EXCEPTION 'authenticated must retain create_order EXECUTE';
            END IF;
            IF anon_ok THEN
              RAISE EXCEPTION 'anon/PUBLIC must not retain create_order EXECUTE';
            END IF;
          END $$;
          SELECT 'Fresh DB effective create_order authority: PASS' AS evidence;
          SQL
      - name: Run database pgTAP proofs
        run: supabase test db --local
      - name: Verify local migration inventory
        run: supabase migration list --local
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
