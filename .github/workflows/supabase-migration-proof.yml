name: supabase-migration-proof

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      exact_sha:
        description: 'Exact Git commit SHA to verify'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aghbari-migration-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ inputs.exact_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
    steps:
      - name: Validate exact SHA input
        shell: bash
        run: echo "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Verify exact target HEAD
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA" || {
            echo "EXACT HEAD MISMATCH: expected=$TARGET_SHA actual=$actual"
            exit 1
          }
          echo "EXACT MIGRATION PROOF HEAD: $actual"
      - name: Fail fast on duplicate migration versions
        shell: bash
        run: |
          versions="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]+)_.*/\1/' | sort)"
          duplicates="$(printf '%s\n' "$versions" | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            echo "Duplicate migration versions detected:"
            printf '%s\n' "$duplicates"
            exit 1
          fi
          echo "Migration version uniqueness: PASS"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start local Supabase
        run: supabase start
      - name: Apply migrations from empty database
        run: supabase db reset --local
      - name: Run targeted pgTAP proofs 014/015/016
        shell: bash
        run: |
          supabase test db --local supabase/tests/014-order-templates-boundary.test.sql
          supabase test db --local supabase/tests/015-order-templates-adversarial-boundary.test.sql
          supabase test db --local supabase/tests/016-quick-order-server-boundary.test.sql
      - name: Regression pgTAP batch 001-006
        shell: bash
        run: |
          supabase test db --local supabase/tests/001-storage-boundary.test.sql
          supabase test db --local supabase/tests/002-outbox-worker.test.sql
          supabase test db --local supabase/tests/003-purchasing-receiving.test.sql
          supabase test db --local supabase/tests/004-staff-price-export-policy.test.sql
          supabase test db --local supabase/tests/005-purchase-idempotency-full-payload.test.sql
          supabase test db --local supabase/tests/006-customer-lifecycle.test.sql
      - name: Regression pgTAP batch 007-012
        shell: bash
        run: |
          supabase test db --local supabase/tests/007-inventory-transfer-thresholds.test.sql
          supabase test db --local supabase/tests/008-finance-invoices-cash-expenses.test.sql
          supabase test db --local supabase/tests/009-cash-account-expense.test.sql
          supabase test db --local supabase/tests/010-import-malformed-numeric.test.sql
          supabase test db --local supabase/tests/010-stock-count-reconciliation.test.sql
          supabase test db --local supabase/tests/011-catalog-warehouse-boundary.test.sql
          supabase test db --local supabase/tests/011-catalog-warehouse-truth.test.sql
          supabase test db --local supabase/tests/011-customer-invitations.test.sql
          supabase test db --local supabase/tests/012-rpc-negative-security.test.sql
          supabase test db --local supabase/tests/012-stock-count-concurrency.test.sql
      - name: Regression pgTAP batch 013-017
        shell: bash
        run: |
          supabase test db --local supabase/tests/013-outbox-definer-search-path.test.sql
          supabase test db --local supabase/tests/013-security-regression-contract.test.sql
          supabase test db --local supabase/tests/013-tenant-mutation-boundary.test.sql
          supabase test db --local supabase/tests/014-cart-order-tenant-boundary.test.sql
          supabase test db --local supabase/tests/014-cart-tenant-boundary.test.sql
          supabase test db --local supabase/tests/014-core-definer-search_path.test.sql
          supabase test db --local supabase/tests/015-import-inventory-delta.test.sql
          supabase test db --local supabase/tests/015-order-tenant-transition-boundary.test.sql
          supabase test db --local supabase/tests/016-import-tenant-boundary.test.sql
          supabase test db --local supabase/tests/017-import-inventory-delta.test.sql
      - name: Regression pgTAP batch 018-021
        shell: bash
        run: |
          supabase test db --local supabase/tests/018-rpc-privilege-surface.test.sql
          supabase test db --local supabase/tests/019-security-definer-contract.test.sql
          supabase test db --local supabase/tests/020-order-state-machine-boundary.test.sql
          supabase test db --local supabase/tests/021-operational-fk-indexes.test.sql
      - name: Verify local migration inventory
        run: supabase migration list --local
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
