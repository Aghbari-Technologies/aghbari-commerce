name: supabase-migration-proof

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      exact_sha:
        description: 'Exact Git SHA to verify'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aghbari-migration-proof-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('sha-{0}', inputs.exact_sha) || github.ref_name }}
  cancel-in-progress: true
jobs:
  migration-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ inputs.exact_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Validate exact SHA input
        shell: bash
        run: echo "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.exact_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify exact target HEAD
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA" || {
            echo "EXACT HEAD MISMATCH: expected=$TARGET_SHA actual=$actual"
            exit 1
          }
          echo "EXACT MIGRATION PROOF HEAD: $actual"
      - name: Fail fast on duplicate migration versions
        shell: bash
        run: |
          versions="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]+)_.*/\1/' | sort)"
          duplicates="$(printf '%s\n' "$versions" | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            echo "Duplicate migration versions detected:"
            printf '%s\n' "$duplicates"
            exit 1
          fi
          echo "Migration version uniqueness: PASS"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start local Supabase
        run: supabase start
      - name: Apply migrations from empty database
        run: supabase db reset --local
      - name: Run pgTAP database tests
        run: supabase test db
      - name: Verify effective final order authority in Fresh DB
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase.env
          source /tmp/supabase.env
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            fn text;
            fn_count integer;
            auth_ok boolean;
            anon_ok boolean;
          BEGIN
            SELECT count(*) INTO fn_count
            FROM pg_proc p
            JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public'
              AND p.proname = 'create_order'
