name: Schema Proof

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-schema-proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PostgreSQL version
        run: psql --version
      - name: Apply schema and execute constraint proof
        run: psql -v ON_ERROR_STOP=1 -f poc/schema-proof/schema-proof.sql
