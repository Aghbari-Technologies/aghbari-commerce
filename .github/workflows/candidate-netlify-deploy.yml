name: Candidate Netlify Deploy / Exact SHA

on:
  push:
    branches:
      - execution/netlify-probe-2facceb3

permissions:
  contents: read

concurrency:
  group: netlify-probe-2facceb3
  cancel-in-progress: false

env:
  EXACT_SHA: 2facceb39aaa826413f20245a6f20b6c2ff7cd34
  NETLIFY_SITE_ID: 6c515d48-3385-46eb-958c-3ff2ee17e95e
  NETLIFY_SITE_URL: https://aghbari-commerce-web.netlify.app

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_EMAIL_B: ${{ secrets.E2E_EMAIL_B }}
      E2E_PASSWORD_B: ${{ secrets.E2E_PASSWORD_B }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 1
      - name: Verify exact source SHA
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXACT_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build exact candidate artifact
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ env.EXACT_SHA }}
      - name: Verify exact artifact
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const m=JSON.parse(fs.readFileSync('dist/build-meta.json','utf8'));
          if(m.product!=='aghbari-commerce') throw new Error('bad product');
          if(m.git_sha!==process.env.EXACT_SHA) throw new Error(`SHA mismatch ${m.git_sha}`);
          console.log(JSON.stringify(m));
          NODE
      - name: Require Netlify token
        run: test -n "$NETLIFY_AUTH_TOKEN"
      - name: Deploy exact artifact to Netlify
        run: npx --yes netlify-cli deploy --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --prod
      - name: Verify public artifact identity
        run: |
          curl --fail --silent --show-error --location --max-time 30 "$NETLIFY_SITE_URL/build-meta.json" -o deployed-meta.json
          node - <<'NODE'
          const fs=require('node:fs');
          const m=JSON.parse(fs.readFileSync('deployed-meta.json','utf8'));
          if(m.product!=='aghbari-commerce') throw new Error('public product mismatch');
          if(m.git_sha!==process.env.EXACT_SHA) throw new Error(`PUBLIC SHA MISMATCH expected=${process.env.EXACT_SHA} actual=${m.git_sha}`);
          console.log('EXACT PUBLIC SHA:',m.git_sha);
          NODE
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Require browser credentials
        run: test -n "$E2E_EMAIL" && test -n "$E2E_PASSWORD" && test -n "$E2E_EMAIL_B" && test -n "$E2E_PASSWORD_B" && test -n "$E2E_ADMIN_EMAIL" && test -n "$E2E_ADMIN_PASSWORD"
      - name: Run deployed customer E2E
        env:
          E2E_BASE_URL: ${{ env.NETLIFY_SITE_URL }}
          EXPECTED_SHA: ${{ env.EXACT_SHA }}
        run: npx playwright test e2e/critical-path.spec.ts --project=chromium
      - name: Run deployed admin E2E
        env:
          E2E_BASE_URL: ${{ env.NETLIFY_SITE_URL }}
          EXPECTED_SHA: ${{ env.EXACT_SHA }}
        run: npx playwright test e2e/admin-control-plane.spec.ts --project=chromium
      - name: Upload deployed browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netlify-browser-e2e-${{ env.EXACT_SHA }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7