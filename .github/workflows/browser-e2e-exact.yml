name: Browser E2E / Exact Deployment

on:
  push:
    branches:
      - main
      - 'execution/**'
  pull_request:
    branches:
      - main
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Exact deployed URL to test'
        required: true
        type: string
      exact_sha:
        description: 'Exact Git SHA expected in the deployed build artifact'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aghbari-browser-e2e-${{ github.event.deployment.sha || inputs.exact_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  browser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'deployment_status' && github.event.deployment.sha || github.event_name == 'workflow_dispatch' && inputs.exact_sha || github.sha }}
    steps:
      - name: Validate exact source SHA
        shell: bash
        run: |
          echo "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "INVALID EXACT SHA: $EXPECTED_SHA"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
      - name: Verify exact source checkout and browser surface
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || { echo "SHA MISMATCH: expected=$EXPECTED_SHA actual=$actual"; exit 1; }
          test -s e2e/critical-path.spec.ts || { echo 'MISSING customer critical-path.spec.ts'; exit 1; }
          test -s e2e/admin-control-plane.spec.ts || { echo 'MISSING admin-control-plane.spec.ts'; exit 1; }
          echo "BROWSER CONTRACT SOURCE SHA: $actual"

  browser-e2e:
    needs: browser-contract
    if: >-
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment_url != '') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: >-
        ${{ github.event_name == 'deployment_status' && (github.event.deployment_status.environment_url || github.event.deployment_status.target_url) || inputs.base_url }}
      EXPECTED_SHA: >-
        ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || inputs.exact_sha }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_EMAIL_B: ${{ secrets.E2E_EMAIL_B }}
      E2E_PASSWORD_B: ${{ secrets.E2E_PASSWORD_B }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Validate exact deployment inputs
        shell: bash
        run: |
          test -n "$E2E_BASE_URL" || { echo 'BLOCKED: E2E_BASE_URL is missing'; exit 1; }
          test -n "$EXPECTED_SHA" || { echo 'BLOCKED: EXPECTED_SHA is missing'; exit 1; }
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET" || { echo 'BLOCKED: VERCEL_AUTOMATION_BYPASS_SECRET is missing; configure Vercel Automation Bypass and GitHub Actions secret'; exit 1; }
          case "$E2E_BASE_URL" in https://*) ;; *) echo 'BLOCKED: E2E_BASE_URL must use HTTPS'; exit 1 ;; esac
          case "$E2E_BASE_URL" in https://vercel.com/*|https://*.vercel.com/*) echo 'BLOCKED: E2E_BASE_URL points to a Vercel dashboard URL, not the deployed application'; exit 1 ;; esac
          echo "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo 'BLOCKED: EXPECTED_SHA is not a full SHA'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
      - name: Fail closed on checked-out SHA drift
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || { echo "SHA MISMATCH: expected=$EXPECTED_SHA actual=$actual"; exit 1; }
          echo "EXACT CHECKED-OUT SHA: $actual"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify deployed artifact identity before browser execution
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 20 \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            -H 'x-vercel-set-bypass-cookie: true' \
            "$E2E_BASE_URL/build-meta.json" -o build-meta.json
          node - <<'NODE'
          const fs = require('node:fs');
          const meta = JSON.parse(fs.readFileSync('build-meta.json', 'utf8'));
          if (meta.product !== 'aghbari-commerce') throw new Error(`Unexpected product: ${meta.product}`);
          if (meta.git_sha !== process.env.EXPECTED_SHA) throw new Error(`DEPLOYED SHA MISMATCH: expected=${process.env.EXPECTED_SHA} actual=${meta.git_sha}`);
          if (typeof meta.version !== 'string' || !meta.version.trim()) throw new Error('Missing deployed version');
          console.log(`EXACT DEPLOYED SHA: ${meta.git_sha}`);
          console.log(`DEPLOYED VERSION: ${meta.version}`);
          NODE
      - name: Require customer E2E credentials
        shell: bash
        run: test -n "$E2E_EMAIL" && test -n "$E2E_PASSWORD" && test -n "$E2E_EMAIL_B" && test -n "$E2E_PASSWORD_B"
      - name: Run customer critical-path browser E2E
        run: npx playwright test e2e/critical-path.spec.ts --project=chromium
      - name: Require admin E2E credentials
        shell: bash
        run: test -n "$E2E_ADMIN_EMAIL" && test -n "$E2E_ADMIN_PASSWORD"
      - name: Run admin control-plane browser E2E
        run: npx playwright test e2e/admin-control-plane.spec.ts --project=chromium
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ env.EXPECTED_SHA }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  pages-exact-source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TARGET_SHA: ${{ github.sha }}
      GITHUB_PAGES: 'true'
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Verify exact source
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA" || { echo "SHA MISMATCH: expected=$TARGET_SHA actual=$actual"; exit 1; }
          echo "EXACT PAGES SOURCE SHA: $actual"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build exact Pages artifact
        run: npm run build

      - name: Verify exact build metadata
        shell: bash
        run: |
          node -e "const m=require('./dist/build-meta.json'); if(m.git_sha!==process.env.TARGET_SHA) { console.error(m); process.exit(1) }"
          test -f dist/index.html
          echo "EXACT PAGES ARTIFACT SHA: $TARGET_SHA"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy exact Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  netlify-exact-source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.sha }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 6c515d48-3385-46eb-958c-3ff2ee17e95e
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Require Netlify deploy credential
        shell: bash
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || {
            echo 'BLOCKED: NETLIFY_AUTH_TOKEN GitHub Actions secret is not configured.'
            exit 1
          }

      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Verify exact source
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA" || { echo "SHA MISMATCH: expected=$TARGET_SHA actual=$actual"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build exact Netlify artifact
        run: npm run build

      - name: Verify exact build metadata
        shell: bash
        run: |
          node -e "const m=require('./dist/build-meta.json'); if(m.git_sha!==process.env.TARGET_SHA) { console.error(m); process.exit(1) }"
          test -f dist/index.html
          echo "EXACT NETLIFY ARTIFACT SHA: $TARGET_SHA"

      - name: Deploy exact source to Netlify
        run: npx --yes netlify-cli@23 deploy --prod --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="aghbari exact source $TARGET_SHA"
