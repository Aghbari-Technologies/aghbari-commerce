name: UI Visual Review / Exact SHA

on:
  push:
    branches:
      - 'proof/**'

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.sha }}
  VITE_BUILD_SHA: ${{ github.sha }}

jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1

      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start fresh local Supabase
        run: supabase start

      - name: Load local Supabase values
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase.env
          source /tmp/supabase.env
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "LOCAL_DB_URL=$DB_URL"
            echo "LOCAL_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Seed browser users and fixtures
        shell: bash
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
          create_user() {
            local email="$1"
            local body
            body="$(printf '{"email":"%s","password":"AghbariE2E!2026","email_confirm":true,"user_metadata":{}}' "$email")"
            code="$(curl -sS -o /tmp/auth-user.out -w '%{http_code}' -X POST "$VITE_SUPABASE_URL/auth/v1/admin/users" -H "apikey: $LOCAL_SERVICE_ROLE_KEY" -H "Authorization: Bearer $LOCAL_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' --data "$body")"
            [[ "$code" =~ ^2[0-9][0-9]$ ]] || { cat /tmp/auth-user.out; exit 1; }
          }
          create_user customer-a@test.local
          create_user customer-b@test.local
          create_user admin-a@test.local
          create_user admin-b@test.local
          echo 'Waiting for Auth users to become visible to Postgres...'
          for i in $(seq 1 20); do
            count="$(psql "$LOCAL_DB_URL" -Atqc "select count(*) from auth.users where email in ('customer-a@test.local','customer-b@test.local','admin-a@test.local','admin-b@test.local');")"
            if [ "$count" = "4" ]; then
              echo 'AUTH_USER_VISIBILITY_READY'
              break
            fi
            echo "AUTH_USER_VISIBILITY_WAIT count=$count attempt=$i"
            sleep 1
          done
          test "$(psql "$LOCAL_DB_URL" -Atqc "select count(*) from auth.users where email in ('customer-a@test.local','customer-b@test.local','admin-a@test.local','admin-b@test.local');")" = "4"
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f scripts/browser-e2e-seed.sql

      - name: Build and start exact production artifact
        run: |
          npm run build
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/aghbari-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/build-meta.json >/dev/null && break
            sleep 1
          done

      - name: Write visual review browser spec
        shell: bash
        run: |
          cat > e2e/visual-review.spec.ts <<'SPEC'
          import { test, expect } from '@playwright/test';

          async function login(page: any, email: string, password: string) {
            await page.goto('/');
            const form = page.locator('form').filter({ has: page.locator('input[type="password"]') }).first();
            await form.locator('input[type="email"]').fill(email);
            await form.locator('input[type="password"]').fill(password);
            await form.getByRole('button', { name: 'دخول آمن' }).click();
            await expect(page.getByRole('button', { name: 'الكتالوج', exact: true }).first()).toBeVisible({ timeout: 15000 });
            await expect(page.locator('.portal-loading')).toHaveCount(0, { timeout: 15000 });
          }

          test('customer desktop visual review', async ({ page }) => {
            await page.setViewportSize({ width: 1440, height: 1000 });
            await login(page, process.env.E2E_EMAIL!, process.env.E2E_PASSWORD!);
            await expect(page.locator('.product-grid')).toBeVisible();
            await page.screenshot({ path: 'visual-evidence/customer-desktop.png', fullPage: true });
          });

          test('customer mobile visual review', async ({ page }) => {
            await page.setViewportSize({ width: 390, height: 844 });
            await login(page, process.env.E2E_EMAIL!, process.env.E2E_PASSWORD!);
            await expect(page.locator('.product-grid')).toBeVisible();
            await page.screenshot({ path: 'visual-evidence/customer-mobile.png', fullPage: true });
          });

          test('staff desktop visual review', async ({ page }) => {
            await page.setViewportSize({ width: 1440, height: 1000 });
            await login(page, process.env.E2E_ADMIN_EMAIL!, process.env.E2E_ADMIN_PASSWORD!);
            await expect(page.getByRole('heading', { name: 'مركز التحكم' }).first()).toBeVisible();
            await page.screenshot({ path: 'visual-evidence/staff-desktop.png', fullPage: true });
          });

          test('staff mobile visual review', async ({ page }) => {
            await page.setViewportSize({ width: 390, height: 844 });
            await login(page, process.env.E2E_ADMIN_EMAIL!, process.env.E2E_ADMIN_PASSWORD!);
            await expect(page.getByRole('heading', { name: 'مركز التحكم' }).first()).toBeVisible();
            await page.screenshot({ path: 'visual-evidence/staff-mobile.png', fullPage: true });
          });
          SPEC

      - name: Run exact browser visual review
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_EMAIL: customer-a@test.local
          E2E_PASSWORD: AghbariE2E!2026
          E2E_ADMIN_EMAIL: admin-a@test.local
          E2E_ADMIN_PASSWORD: AghbariE2E!2026
        run: npx playwright test e2e/visual-review.spec.ts --project=chromium --reporter=list

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aghbari-ui-visual-review-${{ env.EXPECTED_SHA }}
          path: visual-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Stop fresh local Supabase
        if: always()
        run: supabase stop --no-backup
