name: UI Visual Review / Exact SHA

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      exact_sha:
        description: 'Exact Git SHA to verify'
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ inputs.exact_sha || github.event.pull_request.head.sha || github.sha }}
  VITE_BUILD_SHA: ${{ inputs.exact_sha || github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: aghbari-ui-visual-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('sha-{0}', inputs.exact_sha) || github.ref_name }}
  cancel-in-progress: true

jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate exact SHA
        run: echo "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || {
            echo "UI VISUAL SHA MISMATCH expected=$EXPECTED_SHA actual=$actual"
            exit 1
          }
          echo "UI VISUAL EXACT SHA: $actual"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Clean dependency state
        run: rm -rf node_modules dist playwright-report test-results visual-evidence

      - name: Deterministic clean install
        run: npm ci --no-audit --no-fund

      - name: Start isolated local Supabase
        run: supabase start

      - name: Load isolated Supabase values
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase.env
          source /tmp/supabase.env
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "LOCAL_DB_URL=$DB_URL"
            echo "LOCAL_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Seed isolated browser fixtures
        shell: bash
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
          create_user() {
            local email="$1"
            local body
            body="$(printf '{"email":"%s","password":"AghbariE2E!2026","email_confirm":true,"user_metadata":{}}' "$email")"
            code="$(curl -sS -o /tmp/auth-user.out -w '%{http_code}' -X POST "$VITE_SUPABASE_URL/auth/v1/admin/users" -H "apikey: $LOCAL_SERVICE_ROLE_KEY" -H "Authorization: Bearer $LOCAL_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' --data "$body")"
            [[ "$code" =~ ^2[0-9][0-9]$ ]] || { cat /tmp/auth-user.out; exit 1; }
          }
          create_user customer-a@test.local
          create_user customer-b@test.local
          create_user admin-a@test.local
          create_user admin-b@test.local
          for i in $(seq 1 20); do
            count="$(psql "$LOCAL_DB_URL" -Atqc "select count(*) from auth.users where email in ('customer-a@test.local','customer-b@test.local','admin-a@test.local','admin-b@test.local');")"
            if [ "$count" = "4" ]; then break; fi
            sleep 1
          done
          test "$(psql "$LOCAL_DB_URL" -Atqc "select count(*) from auth.users where email in ('customer-a@test.local','customer-b@test.local','admin-a@test.local','admin-b@test.local');")" = "4"
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f scripts/browser-e2e-seed.sql

      - name: Build exact production artifact
        run: npm run build

      - name: Verify artifact identity
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const meta = JSON.parse(fs.readFileSync('dist/build-meta.json', 'utf8'));
          if (meta.product !== 'aghbari-commerce') throw new Error('Unexpected product');
          if (meta.git_sha !== process.env.EXPECTED_SHA) {
            throw new Error(`BUILD SHA MISMATCH expected=${process.env.EXPECTED_SHA} actual=${meta.git_sha}`);
          }
          NODE

      - name: Start local production server
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/build-meta.json >/dev/null && break
            sleep 1
          done
          test -s dist/build-meta.json
          test -s /tmp/preview.log || true

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run exact UI visual review
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_EMAIL: customer-a@test.local
          E2E_PASSWORD: AghbariE2E!2026
          E2E_EMAIL_B: customer-b@test.local
          E2E_PASSWORD_B: AghbariE2E!2026
          E2E_ADMIN_EMAIL: admin-a@test.local
          E2E_ADMIN_PASSWORD: AghbariE2E!2026
        run: npx playwright test e2e/ui-visual-review.spec.ts --project=chromium --reporter=list

      - name: Upload UI visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aghbari-ui-visual-review-${{ env.EXPECTED_SHA }}
          path: |
            visual-evidence/
            playwright-report/
            test-results/
            dist/build-meta.json
            /tmp/preview.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup || true
