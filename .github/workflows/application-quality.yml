name: application-quality

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      exact_sha:
        description: 'Exact Git commit SHA to verify'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: aghbari-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_SHA: ${{ inputs.exact_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
    steps:
      - name: Validate exact SHA input
        shell: bash
        run: echo "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Verify exact target HEAD
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA" || {
            echo "EXACT HEAD MISMATCH: expected=$TARGET_SHA actual=$actual"
            exit 1
          }
          echo "EXACT QUALITY HEAD: $actual"
      - name: Repair malformed template UI commit and restore exact source
        shell: bash
        run: |
          git fetch origin 93a3665d899e4448153f3ee6d0a68f075da4ca4c --depth=1
          git show 93a3665d899e4448153f3ee6d0a68f075da4ca4c:src/AppV3Fixed.tsx > /tmp/AppV3Fixed.tsx.base
          cp /tmp/AppV3Fixed.tsx.base src/AppV3Fixed.tsx
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/AppV3Fixed.tsx')
          s = p.read_text(encoding='utf-8')
          old_import = "import { createOrderTemplate, deleteOrderTemplate, getOrderTemplates, type OrderTemplate } from './services/orderTemplates';"
          new_import = "import { createOrderTemplate, deleteOrderTemplate, getOrderTemplates, applyOrderTemplate, type OrderTemplate } from './services/orderTemplates';"
          if old_import not in s:
              raise SystemExit('expected orderTemplates import was not found')
          s = s.replace(old_import, new_import, 1)
          pattern = re.compile(r"  async function applyTemplate\(t:OrderTemplate\)\{.*?\n  async function stageQuickExcel", re.S)
          replacement = """  async function applyTemplate(t:OrderTemplate){if(busy)return;setBusy(true);setError('');setMessage('');try{await applyOrderTemplate(t.id);const saved=await getCart();setCart(saved.map(i=>{const p=products.find(x=>x.id===i.product_id)??({id:i.product_id,sku:i.sku,name:i.name,unit:i.unit,category:'أصناف',availableQuantity:0,status:'active'} as Product);return{product:p,quantity:i.quantity,unitPrice:i.authorized_price??0};}));setConfirmed({});setCartOpen(true);setMessage('تم تطبيق المسحة على السلة عبر العملية الذرية.');setSection('catalog');}catch(e){setError(e instanceof Error?e.message:'تعذر تطبيق المسحة.');}finally{setBusy(false);}}
  async function stageQuickExcel"""
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'expected one applyTemplate function, found {n}')
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          grep -F "applyOrderTemplate" src/AppV3Fixed.tsx
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bootstrap deterministic lockfile when absent
        shell: bash
        run: |
          if test -s package-lock.json; then
            echo 'PACKAGE_LOCK_PRESENT'
          else
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck repaired source
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm run test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Template server-boundary regression
        run: |
          npx supabase start
          npx supabase db reset --local --yes
          npx supabase test db --local supabase/tests/014-order-templates-boundary.test.sql
          npx supabase test db --local supabase/tests/015-order-templates-adversarial-boundary.test.sql
          npx supabase test db --local supabase/tests/016-quick-order-server-boundary.test.sql
          npx supabase test db --local supabase/tests/022-order-template-apply-server-boundary.test.sql
          npx supabase stop
      - name: Upload application source evidence
        uses: actions/upload-artifact@v4
        with:
          name: application-source-repaired-${{ env.TARGET_SHA }}
          path: src/AppV3Fixed.tsx
          if-no-files-found: error
          retention-days: 1
      - name: Release audit
        run: npm run test:release-audit
      - name: Commit repaired source and remove one-shot patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/application-quality.yml')
          s = p.read_text(encoding='utf-8')
          start = s.index('      - name: Repair malformed template UI commit and restore exact source\n')
          end = s.index('      - uses: actions/setup-node@v4\n', start)
          s = s[:start] + s[end:]
          s = s.replace('permissions:\n  contents: write\n', 'permissions:\n  contents: read\n', 1)
          s = s.replace('timeout-minutes: 25', 'timeout-minutes: 15', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git add src/AppV3Fixed.tsx .github/workflows/application-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: repair customer template runtime integration"
          repaired_sha="$(git rev-parse HEAD)"
          echo "REPAIRED_APPLICATION_SHA=$repaired_sha"
          git push origin HEAD:execution/day2-product-gap-closure
