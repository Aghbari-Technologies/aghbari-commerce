name: application-quality

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Reproducibility remains a release gate: npm ci becomes mandatory once the lockfile is committed.
      - run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm run test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Release audit
        run: npm run test:release-audit
