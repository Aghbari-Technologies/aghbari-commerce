name: Toolchain Refresh / One-Time

on:
  push:
    branches:
      - execution/customer-ui-completion-20260920
    paths:
      - ops/TOOLCHAIN_REFRESH.request

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pushed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${GITHUB_SHA}" || {
            echo "TOOLCHAIN SHA MISMATCH expected=${GITHUB_SHA} actual=$actual"
            exit 1
          }

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh stable toolchain
        run: |
          npm install --save-exact             react@19.3.0             react-dom@19.3.0             @supabase/supabase-js@2.116.0

          npm install --save-exact --save-dev             @types/react@19.3.0             @types/react-dom@19.3.0             @vitejs/plugin-react@6.1.1             @eslint/js@10.0.1             eslint@10.0.1             eslint-plugin-react-hooks@7.1.1             eslint-plugin-react-refresh@0.5.7             typescript@7.0.2             typescript-eslint@8.70.0             vite@8.3.0             vitest@5.0.1

      - name: Validate lockfile and source hygiene
        run: git diff --check

      - name: Commit refresh and remove one-time trigger
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm -f ops/TOOLCHAIN_REFRESH.request .github/workflows/toolchain-refresh-once.yml
          git diff --cached --check
          git commit -m "chore(tooling): refresh stable frontend toolchain"
          git push origin "HEAD:${GITHUB_REF_NAME}"
