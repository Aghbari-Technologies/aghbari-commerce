name: repair-excel-build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify browser Excel reader contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "read-excel-file/browser" src/App.tsx src/services/importExcel.ts
          test -f src/lib/read-excel-file-browser.ts
          grep -F "readXlsxFile" src/App.tsx src/services/importExcel.ts src/lib/read-excel-file-browser.ts

      - name: Verify cloud-backed order template runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -F "applyOrderTemplate" src/AppV3Fixed.tsx
          grep -F "getOrderTemplates" src/services/orderTemplates.ts
          ! grep -R "localStorage.*orderTemplate\|orderTemplate.*localStorage" src/AppV3Fixed.tsx src/services/orderTemplates.ts

      - name: Verify no repair workflow write path remains
        shell: bash
        run: |
          ! grep -Eq "contents: write|git push origin HEAD:main|git commit" .github/workflows/repair-excel-build.yml
          echo "repair-excel-build is verification-only and cannot mutate main."
