name: repair-excel-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Repair read-excel-file v9 imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'src/App.tsx': [
                  ("import readXlsxFile from 'read-excel-file/browser';", "import { readSheet } from 'read-excel-file/browser';"),
                  ('readXlsxFile(', 'readSheet('),
              ],
              'src/services/importExcel.ts': [
                  ("import readSheet from 'read-excel-file/browser';", "import { readSheet } from 'read-excel-file/browser';"),
              ],
          }
          changed = False
          for filename, rules in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in rules:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print(f'REPAIRED: {filename}')
                  changed = True
              else:
                  print(f'UNCHANGED: {filename}')
          if not changed:
              print('NO_REPAIR_NEEDED')
          PY

      - name: Validate and commit repair
        shell: bash
        run: |
          if git diff --quiet -- src/App.tsx src/services/importExcel.ts; then
            echo 'NO_REPAIR_COMMIT_REQUIRED'
            exit 0
          fi
          git diff --check
          git config user.name 'Report-Engainall'
          git config user.email 'ahadnanmo@gmail.com'
          git add src/App.tsx src/services/importExcel.ts
          git commit -m 'fix: use readSheet API for Excel imports'
          git push origin HEAD:main
