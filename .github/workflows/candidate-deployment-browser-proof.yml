name: Certification / Candidate Deployment Browser Proof

on:
  push:
    branches:
      - 'proof/candidate-deployment-browser-20260920'

permissions:
  contents: read

jobs:
  candidate-deployment-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: 1366f8ea240f2b1c58d78a863aa7a5584be531fb
      E2E_BASE_URL: https://aghbari-commerce-c2dd-9k5gyro95-aghbari-technologies1.vercel.app
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_EMAIL_B: ${{ secrets.E2E_EMAIL_B }}
      E2E_PASSWORD_B: ${{ secrets.E2E_PASSWORD_B }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Validate exact candidate target
        shell: bash
        run: |
          echo "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test -n "$E2E_BASE_URL"
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          test -n "$E2E_EMAIL" && test -n "$E2E_PASSWORD"
          test -n "$E2E_EMAIL_B" && test -n "$E2E_PASSWORD_B"
          test -n "$E2E_ADMIN_EMAIL" && test -n "$E2E_ADMIN_PASSWORD"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
      - name: Verify exact candidate checkout
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify candidate deployed artifact
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 20             -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"             "$E2E_BASE_URL/build-meta.json" -o build-meta.json
          node - <<'NODE'
          const fs = require('node:fs');
          const meta = JSON.parse(fs.readFileSync('build-meta.json', 'utf8'));
          if (meta.product !== 'aghbari-commerce') throw new Error('Unexpected product: ' + meta.product);
          if (meta.git_sha !== process.env.EXPECTED_SHA) throw new Error('DEPLOYED SHA MISMATCH: expected=' + process.env.EXPECTED_SHA + ' actual=' + meta.git_sha);
          if (typeof meta.version !== 'string' || !meta.version.trim()) throw new Error('Missing deployed version');
          console.log('EXACT CANDIDATE DEPLOYED SHA: ' + meta.git_sha);
          console.log('DEPLOYED VERSION: ' + meta.version);
          NODE
      - name: Run candidate customer browser E2E
        run: npx playwright test e2e/critical-path.spec.ts --project=chromium
      - name: Run candidate admin browser E2E
        run: npx playwright test e2e/admin-control-plane.spec.ts --project=chromium
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-deployment-browser-${{ env.EXPECTED_SHA }}
          path: |
            playwright-report/
            test-results/
            build-meta.json
          if-no-files-found: ignore
          retention-days: 7
