name: UI Visual Proof / Exact Main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      exact_sha:
        description: 'Exact Git SHA to render'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aghbari-ui-visual-${{ inputs.exact_sha || github.sha }}
  cancel-in-progress: false

jobs:
  visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ inputs.exact_sha || github.sha }}
    steps:
      - name: Validate exact SHA
        shell: bash
        run: echo "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || { echo "SHA MISMATCH expected=$EXPECTED_SHA actual=$actual"; exit 1; }
          echo "EXACT UI VISUAL SHA: $actual"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup local Supabase
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Clean install
        run: |
          rm -rf node_modules dist playwright-report test-results
          npm ci --no-audit --no-fund

      - name: Start isolated Supabase
        run: supabase start

      - name: Load local Supabase environment
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase.env
          source /tmp/supabase.env
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "LOCAL_DB_URL=$DB_URL"
            echo "LOCAL_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Seed deterministic visual fixtures
        shell: bash
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
          create_user() {
            local email="$1"
            local body
            body="$(printf '{"email":"%s","password":"AghbariE2E!2026","email_confirm":true,"user_metadata":{}}' "$email")"
            code="$(curl -sS -o /tmp/auth-user.out -w '%{http_code}' -X POST "$VITE_SUPABASE_URL/auth/v1/admin/users" -H "apikey: $LOCAL_SERVICE_ROLE_KEY" -H "Authorization: Bearer $LOCAL_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' --data "$body")"
            [[ "$code" =~ ^2[0-9][0-9]$ ]] || { cat /tmp/auth-user.out; exit 1; }
          }
          create_user customer-a@test.local
          create_user customer-b@test.local
          create_user admin-a@test.local
          create_user admin-b@test.local
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f scripts/browser-e2e-seed.sql

      - name: Build exact visual artifact
        run: npm run build

      - name: Verify exact build identity
        shell: bash
        run: |
          node -e "const m=require('./dist/build-meta.json'); if(m.product!=='aghbari-commerce'||m.git_sha!==process.env.EXPECTED_SHA) process.exit(1); console.log(m)"
      
      - name: Start exact production preview
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/aghbari-visual-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/build-meta.json >/tmp/served-meta.json; then break; fi
            sleep 1
          done
          diff -u dist/build-meta.json /tmp/served-meta.json

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture Customer + Admin UI screenshots
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_EMAIL: customer-a@test.local
          E2E_PASSWORD: AghbariE2E!2026
          E2E_ADMIN_EMAIL: admin-a@test.local
          E2E_ADMIN_PASSWORD: AghbariE2E!2026
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        run: npx playwright test e2e/ui-reference-coverage.spec.ts --project=chromium --reporter=list

      - name: Upload exact visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aghbari-ui-visual-${{ env.EXPECTED_SHA }}
          path: |
            test-results/
            playwright-report/
            dist/build-meta.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup
