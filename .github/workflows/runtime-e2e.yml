name: Runtime E2E Certification

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed Aghbari URL for runtime verification'
        required: true
        type: string
      exact_sha:
        description: 'Exact Git commit SHA being certified'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aghbari-runtime-e2e-${{ github.workflow }}-${{ github.event.deployment.sha || inputs.exact_sha || github.sha }}
  cancel-in-progress: false

jobs:
  runtime-e2e:
    name: Authenticated browser critical path
    if: >-
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment_url != '') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: >-
        ${{ github.event_name == 'deployment_status' &&
            (github.event.deployment_status.environment_url || github.event.deployment_status.target_url) ||
            inputs.base_url }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_EMAIL_B: ${{ secrets.E2E_EMAIL_B }}
      E2E_PASSWORD_B: ${{ secrets.E2E_PASSWORD_B }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_EXACT_SHA: >-
        ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || inputs.exact_sha }}
    steps:
      - name: Validate exact deployed inputs
        shell: bash
        run: |
          echo "$E2E_EXACT_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test -n "$E2E_BASE_URL"
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          node -e "const u=new URL(process.env.E2E_BASE_URL); if(u.protocol !== 'https:') throw new Error('E2E_BASE_URL must use HTTPS'); if(u.username || u.password) throw new Error('E2E_BASE_URL must not contain credentials'); console.log('Runtime URL origin:', u.origin)"
      - name: Checkout exact certification SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.E2E_EXACT_SHA }}
          fetch-depth: 1
      - name: Verify exact certification HEAD
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$E2E_EXACT_SHA" || {
            echo "EXACT HEAD MISMATCH: expected=$E2E_EXACT_SHA actual=$actual"
            exit 1
          }
          echo "EXACT CERTIFICATION HEAD: $actual"
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify deployed artifact identity
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 20             -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"             "$E2E_BASE_URL/build-meta.json" -o build-meta.json
          node - <<'NODE'
          const fs = require('node:fs');
          const meta = JSON.parse(fs.readFileSync('build-meta.json', 'utf8'));
          if (meta.product !== 'aghbari-commerce') throw new Error('unexpected product: '+meta.product);
          if (meta.git_sha !== process.env.E2E_EXACT_SHA) throw new Error(`DEPLOYED SHA MISMATCH: expected=${process.env.E2E_EXACT_SHA} actual=${meta.git_sha}`);
          if (typeof meta.version !== 'string' || !meta.version.trim()) throw new Error('missing deployed version');
          console.log('EXACT DEPLOYED SHA:', meta.git_sha);
          console.log('DEPLOYED VERSION:', meta.version);
          NODE
      - name: Verify security headers and application shell
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 20 \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            -D headers.txt "$E2E_BASE_URL/" -o index.html
          grep -qi '^content-security-policy:' headers.txt
          grep -qi '^x-content-type-options:.*nosniff' headers.txt
          grep -qi '^x-frame-options:.*DENY' headers.txt
          grep -qi '^strict-transport-security:' headers.txt
          grep -qi '^referrer-policy:' headers.txt
          grep -qi '^permissions-policy:' headers.txt
          grep -qi 'lang="ar"' index.html
          grep -qi 'dir="rtl"' index.html
          grep -qi 'بوابة الأغبري' index.html
          curl --fail --silent --show-error --location --max-time 20 \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$E2E_BASE_URL/manifest.webmanifest" -o manifest.webmanifest
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          if (!p.name || !p.short_name) throw new Error('PWA name contract missing');
          if (p.lang !== 'ar' || p.dir !== 'rtl') throw new Error('PWA locale/direction mismatch');
          if (p.start_url !== '/' || p.scope !== '/') throw new Error('PWA scope/start_url mismatch');
          if (p.display !== 'standalone') throw new Error('PWA display mismatch');
          if (!Array.isArray(p.icons) || p.icons.length < 2) throw new Error('PWA icons incomplete');
          console.log('Security headers + app shell + PWA: PASS');
          NODE
      - name: Require runtime credentials
        shell: bash
        run: |
          test -n "$E2E_EMAIL" && test -n "$E2E_PASSWORD"
          test -n "$E2E_EMAIL_B" && test -n "$E2E_PASSWORD_B"
          test -n "$E2E_ADMIN_EMAIL" && test -n "$E2E_ADMIN_PASSWORD"
      - name: Execute authenticated E2E
        run: npm run test:e2e -- --reporter=list
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aghbari-runtime-e2e-evidence-${{ env.E2E_EXACT_SHA }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
