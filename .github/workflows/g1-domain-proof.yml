name: G1 Domain Proof

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  g1-domain-invariants:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic G1 domain proof
        run: node --test poc/transactional-core/invariants.mjs
      - name: Run PostgreSQL transactional G1 proof
        run: bash poc/transactional-core/run-postgres-g1-proof.sh
