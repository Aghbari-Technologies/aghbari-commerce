name: G1 Domain Proof

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  g1-domain-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run deterministic G1 domain proof
        run: node --test poc/transactional-core/invariants.mjs
