name: order-invariant-contract

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/0025_idempotency_race_authority_hardening.sql'
      - 'scripts/check-order-invariants.mjs'
      - '.github/workflows/order-invariant-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/0025_idempotency_race_authority_hardening.sql'
      - 'scripts/check-order-invariants.mjs'
      - '.github/workflows/order-invariant-contract.yml'

permissions:
  contents: read

concurrency:
  group: aghbari-order-invariant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Exact-head binding
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Order invariant contract
        run: node scripts/check-order-invariants.mjs
