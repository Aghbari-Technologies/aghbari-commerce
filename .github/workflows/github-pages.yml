name: GitHub Pages Exact-Source Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: 'true'
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Verify exact source
        shell: bash
        run: |
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          npm run typecheck
          npm run test -- src/customer-capability-navigation.test.ts src/customer-portal-section-coverage.test.ts src/customer-mobile-navigation.test.ts

      - name: Build
        run: npm run build

      - name: Verify build metadata
        shell: bash
        run: |
          node -e "const m=require('./dist/build-meta.json'); if(m.git_sha!==process.env.GITHUB_SHA) { console.error(m); process.exit(1) }"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy exact build
        id: deployment
        uses: actions/deploy-pages@v4
