name: Runtime E2E / Existing Exact Deployment 574312

on:
  push:
    branches:
      - certification/runtime-e2e-existing-574312
  workflow_dispatch:

permissions:
  contents: read

env:
  EXACT_SHA: 5743127627b2d8d96173759c3d0acebb312ca656
  E2E_BASE_URL: https://aghbari-commerce-c2dd-2isomwxyd-aghbari-technologies1.vercel.app

jobs:
  runtime-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_EMAIL_B: ${{ secrets.E2E_EMAIL_B }}
      E2E_PASSWORD_B: ${{ secrets.E2E_PASSWORD_B }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout exact deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 1
      - name: Verify exact deployed source SHA
        run: test "$(git rev-parse HEAD)" = "$EXACT_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify deployed artifact identity
        run: |
          curl --fail --silent --show-error --max-time 20 -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$E2E_BASE_URL/build-meta.json" -o build-meta.json
          node - <<'NODE'
          const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync('build-meta.json','utf8'));
          if(m.product!=='aghbari-commerce') throw new Error('product mismatch');
          if(m.git_sha!==process.env.EXACT_SHA) throw new Error(`SHA mismatch expected=${process.env.EXACT_SHA} actual=${m.git_sha}`);
          console.log('EXACT DEPLOYED SHA:',m.git_sha);
          NODE
      - name: Verify security headers and PWA shell
        run: |
          curl --fail --silent --show-error --max-time 20 -D headers.txt -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$E2E_BASE_URL/" -o index.html
          grep -qi '^content-security-policy:' headers.txt
          grep -qi '^x-content-type-options:.*nosniff' headers.txt
          grep -qi '^x-frame-options:.*DENY' headers.txt
          grep -qi '^strict-transport-security:' headers.txt
          grep -qi '^referrer-policy:' headers.txt
          grep -qi '^permissions-policy:' headers.txt
          grep -qi 'lang="ar"' index.html
          grep -qi 'dir="rtl"' index.html
          grep -qi 'بوابة الأغبري' index.html
          curl --fail --silent --show-error --max-time 20 -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$E2E_BASE_URL/manifest.webmanifest" -o manifest.webmanifest
          node - <<'NODE'
          const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          if(p.lang!=='ar'||p.dir!=='rtl'||p.start_url!=='/'||p.scope!=='/'||p.display!=='standalone') throw new Error('PWA contract mismatch');
          if(!Array.isArray(p.icons)||p.icons.length<2) throw new Error('PWA icons incomplete');
          console.log('Security headers + shell + PWA: PASS');
          NODE
      - name: Require runtime credentials
        run: |
          test -n "$E2E_EMAIL" && test -n "$E2E_PASSWORD"
          test -n "$E2E_EMAIL_B" && test -n "$E2E_PASSWORD_B"
          test -n "$E2E_ADMIN_EMAIL" && test -n "$E2E_ADMIN_PASSWORD"
      - name: Run full authenticated runtime E2E
        run: npm run test:e2e -- --project=chromium --reporter=list
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-e2e-existing-574312
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
