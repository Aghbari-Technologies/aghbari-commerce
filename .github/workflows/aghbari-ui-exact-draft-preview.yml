name: Aghbari UI Exact Draft Preview

on:
  push:
    branches:
      - execution/customer-ui-completion-20260920

permissions:
  contents: read

concurrency:
  group: aghbari-ui-draft-preview
  cancel-in-progress: true

env:
  NETLIFY_SITE_ID: 6c515d48-3385-46eb-958c-3ff2ee17e95e
  SUPABASE_URL: https://mrcyqezbhpncuvaehwgf.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_WVcYLR2Evhr75RAmUHQBGg_BPkZEnNW
  EXACT_SHA: ${{ github.sha }}

jobs:
  deploy-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 1

      - name: Verify exact SHA
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXACT_SHA" || {
            echo "EXACT SHA MISMATCH expected=$EXACT_SHA actual=$actual"
            exit 1
          }
          echo "EXACT UI DRAFT SHA: $actual"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build exact UI artifact
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ env.EXACT_SHA }}
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify exact artifact identity
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const m = JSON.parse(fs.readFileSync('dist/build-meta.json', 'utf8'));
          if (m.product !== 'aghbari-commerce') throw new Error('PRODUCT_MISMATCH');
          if (m.git_sha !== process.env.EXACT_SHA) throw new Error(`SHA_MISMATCH ${m.git_sha}`);
          console.log(JSON.stringify(m));
          NODE

      - name: Require Netlify token
        run: test -n "$NETLIFY_AUTH_TOKEN"

      - name: Deploy exact artifact as draft
        shell: bash
        run: |
          npx --yes netlify-cli@latest deploy \
            --dir=dist \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --no-build \
            --json | tee netlify-deploy.json

      - name: Extract draft URL and verify exact SHA
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync('netlify-deploy.json', 'utf8').trim();
          let j;
          try { j = JSON.parse(raw); }
          catch {
            const lines = raw.split(/\r?\n/).filter(Boolean);
            j = JSON.parse(lines.at(-1));
          }
          const url = j.deploy_url || j.ssl_url || j.url || j.deployUrl;
          if (!url) throw new Error('MISSING_DRAFT_URL');
          fs.writeFileSync('draft-url.txt', url + '\n');
          console.log('EXACT_DRAFT_URL=' + url);
          NODE
          draft_url="$(cat draft-url.txt)"
          curl --fail --silent --show-error --location --max-time 30 "$draft_url/build-meta.json" -o deployed-meta.json
          node - <<'NODE'
          const fs = require('node:fs');
          const m = JSON.parse(fs.readFileSync('deployed-meta.json', 'utf8'));
          if (m.product !== 'aghbari-commerce') throw new Error('PUBLIC_PRODUCT_MISMATCH');
          if (m.git_sha !== process.env.EXACT_SHA) throw new Error(`PUBLIC_SHA_MISMATCH ${m.git_sha}`);
          console.log('PUBLIC_EXACT_SHA=' + m.git_sha);
          NODE

      - name: Publish preview URL to step summary
        if: always()
        shell: bash
        run: |
          if test -s draft-url.txt; then
            echo "### Aghbari Exact UI Draft Preview" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "SHA: $EXACT_SHA" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Preview: $(cat draft-url.txt)" >> "$GITHUB_STEP_SUMMARY"
          fi
