name: Final Regression / Exact Artifact

on:
  push:
    branches:
      - 'enhancement/**'
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed Aghbari URL to smoke-test'
        required: true
        type: string
      exact_sha:
        description: 'Exact Git SHA expected in the deployed build artifact'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aghbari-final-regression-${{ github.event.deployment.sha || inputs.exact_sha || github.sha }}
  cancel-in-progress: false

jobs:
  local-final-regression:
    name: Local Final Regression / Exact Source Artifact
    if: github.event_name == 'push' && startsWith(github.ref_name, 'enhancement/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.sha }}
      SUPABASE_URL: https://mrcyqezbhpncuvaehwgf.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_WVcYLR2Evhr75RAmUHQBGg_BPkZEnNW
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1

      - name: Validate exact source SHA
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "EXACT FINAL REGRESSION HEAD: $actual"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Deterministic dependency install
        run: npm ci --no-audit --no-fund

      - name: Build exact source artifact
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ env.EXPECTED_SHA }}
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify exact artifact identity
        shell: bash
        run: |
          test -s dist/build-meta.json
          node - <<'NODE'
          const fs = require('node:fs');
          const meta = JSON.parse(fs.readFileSync('dist/build-meta.json', 'utf8'));
          if (meta.product !== 'aghbari-commerce') throw new Error(`Unexpected product: ${meta.product}`);
          if (meta.git_sha !== process.env.EXPECTED_SHA) throw new Error(`SOURCE SHA MISMATCH: expected=${process.env.EXPECTED_SHA} actual=${meta.git_sha}`);
          if (typeof meta.version !== 'string' || !meta.version.trim()) throw new Error('Missing application version');
          const buildAt = meta.built_at || meta.build_time;
          if (typeof buildAt !== 'string' || Number.isNaN(Date.parse(buildAt))) throw new Error('Invalid build timestamp');
          console.log(`EXACT ARTIFACT SHA: ${meta.git_sha}`);
          console.log(`ARTIFACT VERSION: ${meta.version}`);
          console.log(`ARTIFACT BUILD TIME: ${buildAt}`);
          NODE

      - name: Verify application shell
        shell: bash
        run: |
          test -s dist/index.html
          grep -qi '<html' dist/index.html
          grep -qi 'lang="ar"' dist/index.html
          grep -qi 'dir="rtl"' dist/index.html
          grep -qi 'بوابة الأغبري' dist/index.html
          grep -q 'type="module"' dist/index.html

      - name: Verify PWA manifest contract
        shell: bash
        run: |
          test -s dist/manifest.webmanifest
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('dist/manifest.webmanifest', 'utf8'));
          if (!p.name || !p.short_name) throw new Error('PWA name contract missing');
          if (p.lang !== 'ar' || p.dir !== 'rtl') throw new Error('PWA locale/direction contract mismatch');
          if (p.start_url !== '/' || p.scope !== '/') throw new Error('PWA scope/start_url contract mismatch');
          if (p.display !== 'standalone') throw new Error('PWA display contract mismatch');
          if (!Array.isArray(p.icons) || p.icons.length < 2) throw new Error('PWA icon contract incomplete');
          for (const icon of p.icons) if (!icon.src || !icon.sizes || !icon.type) throw new Error('Invalid PWA icon entry');
          console.log('PWA manifest: PASS');
          NODE

      - name: Verify service worker
        shell: bash
        run: |
          test -s dist/sw.js
          grep -q 'self.addEventListener' dist/sw.js
          grep -q 'fetch' dist/sw.js
          echo 'Service worker: PASS'

  deployed-final-regression:
    name: Deployed Final Regression / Exact Artifact
    if: >-
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       (startsWith(github.event.deployment.ref, 'enhancement/') || startsWith(github.event.deployment.ref, 'certification/'))) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: >-
        ${{ github.event_name == 'deployment_status' && (github.event.deployment_status.environment_url || github.event.deployment_status.target_url) || inputs.base_url }}
      EXPECTED_SHA: >-
        ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || inputs.exact_sha }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1

      - name: Validate exact release inputs
        shell: bash
        run: |
          test -n "$BASE_URL"
          test -n "$EXPECTED_SHA"
          case "$BASE_URL" in
            https://*) ;;
            *) echo 'BASE_URL must use HTTPS'; exit 1 ;;
          esac
          echo "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "EXACT DEPLOYED REGRESSION SOURCE HEAD: $actual"

      - name: Require deployment protection credential
        run: test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"

      - name: Verify deployed artifact identity
        run: |
          curl --fail --silent --show-error --location --max-time 15             -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"             "$BASE_URL/build-meta.json" -o build-meta.json
          node - <<'NODE'
          const fs = require('node:fs');
          const meta = JSON.parse(fs.readFileSync('build-meta.json', 'utf8'));
          if (meta.product !== 'aghbari-commerce') throw new Error(`Unexpected product: ${meta.product}`);
          if (meta.git_sha !== process.env.EXPECTED_SHA) throw new Error(`DEPLOYED SHA MISMATCH: expected=${process.env.EXPECTED_SHA} actual=${meta.git_sha}`);
          if (typeof meta.version !== 'string' || !meta.version.trim()) throw new Error('Missing deployed application version');
          const buildAt = meta.built_at || meta.build_time;
          if (typeof buildAt !== 'string' || Number.isNaN(Date.parse(buildAt))) throw new Error('Invalid deployed build timestamp');
          console.log(`EXACT DEPLOYED SHA: ${meta.git_sha}`);
          console.log(`DEPLOYED VERSION: ${meta.version}`);
          console.log(`DEPLOYED BUILD TIME: ${buildAt}`);
          NODE

      - name: Verify security headers and hardening
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 15             -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"             -D headers.txt -o /dev/null "$BASE_URL/"
          grep -qi '^content-security-policy:' headers.txt
          grep -qi '^x-content-type-options:.*nosniff' headers.txt
          grep -qi '^x-frame-options:.*DENY' headers.txt
          grep -qi '^strict-transport-security:' headers.txt
          grep -qi '^referrer-policy:' headers.txt
          grep -qi '^permissions-policy:' headers.txt

      - name: Verify application shell
        run: |
          curl --fail --silent --show-error --location --max-time 15             -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"             "$BASE_URL/" -o index.html
          grep -qi '<html' index.html
          grep -qi 'lang="ar"' index.html
          grep -qi 'dir="rtl"' index.html
          grep -qi 'بوابة الأغبري' index.html
          grep -q 'type="module"' index.html

      - name: Verify PWA manifest contract
        run: |
          curl --fail --silent --show-error --location --max-time 15             -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"             "$BASE_URL/manifest.webmanifest" -o manifest.webmanifest
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          if (!p.name || !p.short_name) throw new Error('PWA name contract missing');
          if (p.lang !== 'ar' || p.dir !== 'rtl') throw new Error('PWA locale/direction contract mismatch');
          if (p.start_url !== '/' || p.scope !== '/') throw new Error('PWA scope/start_url contract mismatch');
          if (p.display !== 'standalone') throw new Error('PWA display contract mismatch');
          if (!Array.isArray(p.icons) || p.icons.length < 2) throw new Error('PWA icon contract incomplete');
          for (const icon of p.icons) if (!icon.src || !icon.sizes || !icon.type) throw new Error('Invalid PWA icon entry');
          NODE

      - name: Verify service worker
        run: |
          curl --fail --silent --show-error --location --max-time 15             -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"             "$BASE_URL/sw.js" -o sw.js
          test -s sw.js
          grep -q 'self.addEventListener' sw.js
          grep -q 'fetch' sw.js
          echo 'Service worker: PASS'
