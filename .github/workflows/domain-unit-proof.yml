name: Domain Unit Proof

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  domain-unit-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Domain tests
        run: npm run test:domain
