name: Aghbari Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: aghbari-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm exec vitest run src/services/staffOrders.detail.test.ts src/structure/admin-structure.anchor.test.ts src/services/customerProfile.test.ts src/services/purchasing.update.test.ts src/domain/customerAddresses.test.ts src/structure/admin-structure.edit-contract.test.ts src/structure/ui-reference-packs.test.ts src/brand-identity.test.ts src/customer-mobile-navigation.test.ts src/admin-boundary-navigation.test.ts
      - run: npm run build
