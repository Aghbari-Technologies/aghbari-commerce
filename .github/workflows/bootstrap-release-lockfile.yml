name: bootstrap-release-lockfile

on:
  push:
    branches:
      - main
      - execution/close-lockfile-20260907
      - security/rpc-surface-final6
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CI: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Validate exact target SHA
        shell: bash
        run: echo "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Checkout exact target SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact target HEAD
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA" || {
            echo "EXACT HEAD MISMATCH: expected=$TARGET_SHA actual=$actual"
            exit 1
          }
          echo "EXACT BOOTSTRAP RELEASE LOCKFILE HEAD: $actual"

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Verify package inputs
        run: |
          node --version
          npm --version
          test -f package.json
          npm pkg get name version engines dependencies devDependencies

      - name: Verify lockfile determinism
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json
          node -e "const p=require('./package-lock.json'); if (p.lockfileVersion !== 3) process.exit(1); console.log('lockfileVersion=' + p.lockfileVersion)"

      - name: Verify immutable bootstrap contract
        shell: bash
        run: |
          grep -Eq '(^|[[:space:]])contents:[[:space:]]*read([[:space:]]|$)' .github/workflows/bootstrap-release-lockfile.yml
          ! grep -Eq '(^|[[:space:]])contents:[[:space:]]*write([[:space:]]|$)' .github/workflows/bootstrap-release-lockfile.yml
          ! grep -Eq 'git[[:space:]]+push' .github/workflows/bootstrap-release-lockfile.yml
          echo 'BOOTSTRAP WORKFLOW: READ-ONLY / NO-PUSH'
