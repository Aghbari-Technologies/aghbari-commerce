name: bootstrap-release-lockfile

on:
  push:
    branches:
      - main
      - execution/close-lockfile-20260907
      - security/rpc-surface-final6
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CI: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify package inputs
        run: |
          node --version
          npm --version
          test -f package.json
          npm pkg get name version engines dependencies devDependencies

      - name: Verify lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json
          node -e "const p=require('./package-lock.json'); if (p.lockfileVersion !== 3) process.exit(1); console.log('lockfileVersion=' + p.lockfileVersion)"

      - name: Verify immutable bootstrap contract
        shell: bash
        run: |
          if grep -Eq '(^|[[:space:]])contents:[[:space:]]*write([[:space:]]|$)' .github/workflows/bootstrap-release-lockfile.yml; then
            echo 'BOOTSTRAP WORKFLOW MUST REMAIN READ-ONLY'
            exit 1
          fi
          if grep -Eq 'git[[:space:]]+push' .github/workflows/bootstrap-release-lockfile.yml; then
            echo 'BOOTSTRAP WORKFLOW MUST NOT PUSH'
            exit 1
          fi
