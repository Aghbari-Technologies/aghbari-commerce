name: app-quality
on:
  pull_request:
    branches: [main, execution/maximum-parallel-2026-09-04]
  push:
    branches: [execution/maximum-parallel-2026-09-04]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Exact-head binding
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Order invariant contract
        run: node scripts/check-order-invariants.mjs
