name: Invitation Runtime Diagnostic / Deployment 574312

on:
  push:
    branches:
      - certification/runtime-diagnostics-574312-invitation
permissions:
  contents: read
env:
  DEPLOYED_SHA: 5743127627b2d8d96173759c3d0acebb312ca656
  E2E_BASE_URL: https://aghbari-commerce-c2dd-2isomwxyd-aghbari-technologies1.vercel.app
jobs:
  invitation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: curl --fail --silent --show-error --max-time 20 -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$E2E_BASE_URL/build-meta.json" -o build-meta.json
      - run: node -e "const m=require('./build-meta.json'); if(m.git_sha!==process.env.DEPLOYED_SHA) process.exit(1)"
      - run: npx playwright test e2e/invitation-journey.spec.ts --project=chromium --reporter=list
