name: Concurrency Proof / Exact SHA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      exact_sha:
        description: 'Exact Git SHA to verify'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aghbari-concurrency-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('sha-{0}', inputs.exact_sha) || github.ref_name }}
  cancel-in-progress: true
jobs:
  concurrency-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.exact_sha || github.sha }}
    steps:
      - name: Validate exact SHA
        shell: bash
        run: |
          echo "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "INVALID SHA: $EXPECTED_SHA"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
      - name: Verify exact checkout
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || { echo "SHA MISMATCH expected=$EXPECTED_SHA actual=$actual"; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start Supabase and reset from zero
        run: |
          supabase start
          supabase db reset --local
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run original exact concurrent order/idempotency proof
        run: bash scripts/concurrency-proof.sh
      - name: Run expanded nine-surface concurrency matrix
        run: bash scripts/concurrency-matrix-proof.sh
      - name: Run 8-way reporting race hammer
        run: bash scripts/concurrency-reporting-8way-proof.sh
      - name: Run 8-way order race and replay hammer
        run: bash scripts/concurrency-order-8way-proof.sh
      - name: Stop Supabase
        if: always()
        run: supabase stop
