name: Concurrency Proof

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      exact_sha:
        description: 'Exact Git commit SHA to verify'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aghbari-concurrency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  concurrency-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ inputs.exact_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
    steps:
      - name: Validate exact SHA input
        shell: bash
        run: echo "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Verify exact target HEAD
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA" || exit 1
          echo "EXACT CONCURRENCY PROOF HEAD: $actual"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start local Supabase
        run: supabase start
      - name: Apply migrations from empty database
        run: supabase db reset --local
      - name: Execute true multi-session stock race
        run: bash scripts/concurrency-order-proof.sh
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
