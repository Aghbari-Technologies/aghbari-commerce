name: Closure Parallel Gate 2026-09-15

on:
  push:
    branches: ['candidate/closure-20260915']
  pull_request:
    branches: [main, 'candidate/closure-20260915']
  workflow_dispatch:
    inputs:
      exact_sha:
        description: 'Exact Git commit SHA to verify'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: closure-20260915-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ inputs.exact_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-sha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Verify exact SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo "EXACT SHA: $TARGET_SHA"

  application-quality:
    runs-on: ubuntu-latest
    needs: exact-sha
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:product-integrity
      - run: npm run test:architecture
      - run: npm run typecheck
      - run: npm run lint
      - name: Run unit suite with diagnostic artifact
        shell: bash
        run: |
          set +e
          npm test -- --run --reporter=verbose > /tmp/npm-test.log 2>&1
          rc=$?
          set -e
          cat /tmp/npm-test.log
          exit "$rc"
      - name: Upload unit-test diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closure-unit-test-diagnostic-${{ env.TARGET_SHA }}
          path: /tmp/npm-test.log
          if-no-files-found: error
          retention-days: 7
      - name: TEST-THE-TEST order contract mutation
        shell: bash
        run: |
          cp src/services/orders.ts /tmp/orders.ts
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/orders.ts')
          s = p.read_text()
          old = 'quantity > MAX_ORDER_QUANTITY_PER_LINE'
          new = 'quantity > MAX_ORDER_QUANTITY_PER_LINE + 1'
          if old not in s:
              raise SystemExit('order mutation target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          set +e
          npx vitest run src/services/orders.test.ts --reporter=verbose > /tmp/order-mutation.log 2>&1
          rc=$?
          set -e
          cat /tmp/order-mutation.log
          mv /tmp/orders.ts src/services/orders.ts
          test "$rc" -ne 0
          echo "TEST-THE-TEST: order contract mutation correctly failed"
      - name: Re-run order contract after mutation restore
        run: npx vitest run src/services/orders.test.ts
      - run: npm run build
      - run: npm run test:release-audit

  fresh-db:
    runs-on: ubuntu-latest
    needs: exact-sha
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local Supabase
        run: supabase start
      - name: Reset from zero and apply every migration
        run: supabase db reset --local
      - name: Run complete pgTAP suite
        run: supabase test db --local
      - name: Verify migration inventory
        run: supabase migration list --local
      - name: TEST-THE-TEST F04 intentional mutation
        shell: bash
        run: |
          cp supabase/tests/031-f04-f29-adversarial-transfer.test.sql /tmp/f04.sql
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/tests/031-f04-f29-adversarial-transfer.test.sql')
          s = p.read_text()
          old = "'valid transfer');"
          new = "'INTENTIONAL TEST MUTATION');"
          if old not in s:
              raise SystemExit('mutation target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          set +e
          supabase test db --local > /tmp/mutation.log 2>&1
          rc=$?
          set -e
          cat /tmp/mutation.log
          mv /tmp/f04.sql supabase/tests/031-f04-f29-adversarial-transfer.test.sql
          test "$rc" -ne 0
          echo "TEST-THE-TEST: intentional mutation correctly failed"
      - name: Re-run clean F04 after mutation reset
        run: supabase test db --local
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  browser-runtime:
    runs-on: ubuntu-latest
    needs: exact-sha
    timeout-minutes: 25
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_EMAIL_B: ${{ secrets.E2E_EMAIL_B }}
      E2E_PASSWORD_B: ${{ secrets.E2E_PASSWORD_B }}
    steps:
      - name: Require complete browser certification inputs
        shell: bash
        run: |
          test -n "$E2E_BASE_URL"
          test -n "$E2E_EMAIL"
          test -n "$E2E_PASSWORD"
          test -n "$E2E_EMAIL_B"
          test -n "$E2E_PASSWORD_B"
          node -e "const u=new URL(process.env.E2E_BASE_URL); if(u.protocol !== 'https:') throw new Error('E2E_BASE_URL must use HTTPS'); if(u.username || u.password) throw new Error('E2E_BASE_URL must not contain credentials'); console.log('Runtime URL origin:', u.origin)"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run browser runtime certification
        run: npm run test:e2e

  security-advisors:
    runs-on: ubuntu-latest
    needs: exact-sha
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Static security contract scan
        shell: bash
        run: |
          ! grep -nE 'continue-on-error: *true|(^|[[:space:]])\|\| true([[:space:]]|$)' .github/workflows/closure-parallel-20260915.yml
          echo 'Closure workflow hidden-failure scan: PASS'

  closure-result:
    runs-on: ubuntu-latest
    if: always()
    needs: [exact-sha, application-quality, fresh-db, browser-runtime, security-advisors]
    steps:
      - name: Summarize closure gate
        shell: bash
        run: |
          echo "EXACT SHA: $TARGET_SHA"
          echo "application-quality=${{ needs.application-quality.result }}"
          echo "fresh-db=${{ needs.fresh-db.result }}"
          echo "browser-runtime=${{ needs.browser-runtime.result }}"
          echo "security-advisors=${{ needs.security-advisors.result }}"
          test "${{ needs.application-quality.result }}" = success
          test "${{ needs.fresh-db.result }}" = success
          test "${{ needs.browser-runtime.result }}" = success
          test "${{ needs.security-advisors.result }}" = success
