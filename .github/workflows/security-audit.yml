name: security-audit

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact-head binding
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies without lifecycle scripts
        run: npm install --ignore-scripts
      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high
      - name: Database security contract
        run: node scripts/check-database-security-contract.mjs
      - name: Reject server secrets from browser sources
        shell: bash
        run: |
          if git grep -n -E 'SUPABASE_SERVICE_ROLE_KEY|VITE_SUPABASE_SERVICE_ROLE|sb_secret_' -- src public index.html; then
            echo 'Server-only Supabase secrets must never appear in browser-delivered sources.'
            exit 1
          fi
          echo 'Browser secret boundary: PASS'
