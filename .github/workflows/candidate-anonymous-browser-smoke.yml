name: Candidate Anonymous Browser Smoke

on:
  push:
    branches:
      - execution/closure-war-room-20260917
  workflow_dispatch:
    inputs:
      exact_sha:
        description: 'Exact SHA to build and smoke-test'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aghbari-candidate-anonymous-smoke
  cancel-in-progress: false

env:
  SUPABASE_URL: https://mrcyqezbhpncuvaehwgf.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_WVcYLR2Evhr75RAmUHQBGg_BPkZEnNW
  TARGET_SHA: ${{ inputs.exact_sha || github.sha }}

jobs:
  public-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate exact SHA
        run: echo "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Verify exact candidate HEAD
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build exact candidate artifact
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ env.TARGET_SHA }}
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
      - name: Verify local artifact identity
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const m=JSON.parse(fs.readFileSync('dist/build-meta.json','utf8'));
          if(m.product!=='aghbari-commerce') throw new Error('Invalid product marker');
          if(m.git_sha!==process.env.TARGET_SHA) throw new Error('LOCAL SHA MISMATCH: '+m.git_sha);
          NODE
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Deploy temporary anonymous Netlify preview
        run: |
          npx --yes netlify-cli deploy --dir=dist --allow-anonymous --no-build --json > anonymous-deploy.json
      - name: Extract anonymous preview URL
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const raw=fs.readFileSync('anonymous-deploy.json','utf8').trim();
          const data=JSON.parse(raw);
          const preferredKeys=['deploy_url','deployUrl','deploy_ssl_url','deploySslUrl','ssl_url','sslUrl','url'];
          function walk(value){
            if(!value || typeof value!=='object') return null;
            for(const key of preferredKeys){
              if(typeof value[key]==='string' && /^https:\/\//.test(value[key])) return value[key];
            }
            if(Array.isArray(value)){ for(const item of value){ const found=walk(item); if(found) return found; } }
            else { for(const item of Object.values(value)){ const found=walk(item); if(found) return found; } }
            return null;
          }
          const preferredSite = data.site_url || data.siteUrl || null;
          const url = preferredSite ? preferredSite.replace(/^http:\/\//,'https://') : walk(data);
          if(!url || !/^https:\/\//.test(url)) throw new Error('No HTTPS deploy URL in Netlify JSON: '+raw.slice(0,2000));
          if(typeof data.password==='string' && data.password){
            console.log('Netlify anonymous password gate detected; keeping the value masked for the browser step.');
            console.log('::add-mask::'+data.password);
            fs.appendFileSync(process.env.GITHUB_ENV,'DROP_PASSWORD='+data.password+'\n');
          }
          fs.appendFileSync(process.env.GITHUB_ENV,'E2E_BASE_URL='+url+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### Exact anonymous preview\n'+url+'\n');
          console.log('ANONYMOUS_PREVIEW_URL='+url);
          NODE
      - name: Run real browser public smoke
        env:
          SMOKE_URL: ${{ env.E2E_BASE_URL }}
          EXPECTED_SHA: ${{ env.TARGET_SHA }}
        run: |
          cat > /tmp/aghbari-public-smoke.mjs <<'NODE'
          import { chromium } from '@playwright/test';
          const url=process.env.SMOKE_URL;
          const expected=process.env.EXPECTED_SHA;
          if(!url || !expected) throw new Error('Smoke inputs missing');
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const failures=[];
          page.on('pageerror',e=>failures.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error') failures.push('console: '+m.text())});
          page.on('response',r=>{if(r.status()>=400 && !r.url().endsWith('/favicon.ico')) failures.push(r.status()+' '+r.request().method()+' '+r.url())});
          await page.goto(url,{waitUntil:'networkidle',timeout:30000});
          const passwordGate=await page.locator('input[type="password"]').count();
          if(passwordGate){
            const password=process.env.DROP_PASSWORD;
            if(!password) throw new Error('Netlify anonymous password gate detected but password was not returned by CLI');
            await page.locator('input[type="password"]').fill(password);
            const submit=page.getByRole('button',{name:/Submit|إرسال|دخول|متابعة/i}).first();
            await submit.click();
            await page.waitForLoadState('networkidle');
          }
          if(!(await page.locator('h1').filter({hasText:'بوابة الأغبري التجارية'}).count())) throw new Error('Aghbari landing heading missing');
          if(await page.getByText('العامري',{exact:false}).count()) throw new Error('Legacy branding detected');
          const dir=await page.locator('html').getAttribute('dir');
          if(dir!=='rtl') throw new Error('RTL shell missing');
          const meta=await page.evaluate(async()=>await (await fetch('/build-meta.json',{cache:'no-store'})).json());
          if(meta.git_sha!==expected) throw new Error('Browser-visible SHA mismatch: '+meta.git_sha);
          if(meta.product!=='aghbari-commerce') throw new Error('Browser-visible product mismatch');
          const manifest=await page.request.get(new URL('/manifest.webmanifest',url).toString());
          if(!manifest.ok()) throw new Error('Manifest unavailable: '+manifest.status());
          const sw=await page.evaluate(async()=>Boolean(navigator.serviceWorker));
          if(!sw) throw new Error('Service Worker API unavailable');
          if(failures.length) throw new Error('Browser failures: '+failures.join(' | '));
          console.log('PUBLIC BROWSER SMOKE PASS',JSON.stringify({url,expectedSha:expected,rtl:dir,manifest:manifest.status(),serviceWorkerApi:sw}));
          await browser.close();
          NODE
          node /tmp/aghbari-public-smoke.mjs
