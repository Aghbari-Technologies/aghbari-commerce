name: bootstrap-release-lockfile

on:
  push:
    branches:
      - execution/release-hardening-audit-20260906
      - execution/bootstrap-lockfile-20260906

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify npm inputs
        run: |
          node --version
          npm --version
          test -f package.json
          npm pkg get name version engines dependencies devDependencies
      - name: Generate deterministic npm lockfile
        id: lockfile
        shell: bash
        run: |
          set +e
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund >npm-lockfile.log 2>&1
          status=$?
          cat npm-lockfile.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload lockfile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-lockfile-diagnostics-${{ github.run_id }}
          path: npm-lockfile.log
          if-no-files-found: warn
      - name: Fail if lockfile generation failed
        if: steps.lockfile.outputs.exit_code != '0'
        run: |
          echo "Deterministic lockfile generation failed with exit code ${{ steps.lockfile.outputs.exit_code }}"
          exit 1
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add deterministic npm lockfile"
          git push
