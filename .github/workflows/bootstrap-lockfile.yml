name: bootstrap-release-lockfile

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate generated lockfile
        run: |
          test -s package-lock.json
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion !== 3) process.exit(1); if(!p.packages || !p.packages['']) process.exit(1); console.log('lockfileVersion=',p.lockfileVersion); console.log('root=',p.packages[''].name,p.packages[''].version)"
      - name: Verify npm ci against generated lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add deterministic npm lockfile"
          git push origin HEAD:main
