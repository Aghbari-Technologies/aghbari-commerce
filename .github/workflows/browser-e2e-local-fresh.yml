name: Browser E2E / Fresh Local Supabase

on:
  push:
    branches:
      - 'execution/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      exact_sha:
        description: 'Exact Git SHA to verify'
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ inputs.exact_sha || github.event.pull_request.head.sha || github.sha }}
  VITE_BUILD_SHA: ${{ inputs.exact_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  fresh-local-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate exact SHA
        run: echo "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Clean install
        run: |
          rm -rf node_modules dist playwright-report test-results
          npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start fresh local Supabase
        run: supabase start
      - name: Load local Supabase connection values
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase.env
          source /tmp/supabase.env
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "LOCAL_DB_URL=$DB_URL"
            echo "LOCAL_ANON_KEY=$ANON_KEY"
            echo "LOCAL_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Seed fresh browser fixtures
        shell: bash
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
          create_user() {
            local email="$1"
            local body
            body="$(printf '{"email":"%s","password":"AghbariE2E!2026","email_confirm":true,"user_metadata":{}}' "$email")"
            code="$(curl -sS -o /tmp/auth-user.out -w '%{http_code}' -X POST "$VITE_SUPABASE_URL/auth/v1/admin/users" -H "apikey: $LOCAL_SERVICE_ROLE_KEY" -H "Authorization: Bearer $LOCAL_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' --data "$body")"
            [[ "$code" =~ ^2[0-9][0-9]$ ]] || { cat /tmp/auth-user.out; exit 1; }
          }
          create_user customer-a@test.local
          create_user customer-b@test.local
          create_user admin-a@test.local
          create_user admin-b@test.local
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f scripts/browser-e2e-seed.sql
      - name: Production build with local test-only environment
        run: npm run build
      - name: Verify exact artifact identity
        shell: bash
        run: |
          test -s dist/build-meta.json
          node -e "const m=require('./dist/build-meta.json'); if(m.product!=='aghbari-commerce'||m.git_sha!==process.env.EXPECTED_SHA) process.exit(1); console.log(m)"
          sha256sum dist/build-meta.json
      - name: Start production preview
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/build-meta.json >/tmp/served-meta.json && break || sleep 1; done
          diff -u dist/build-meta.json /tmp/served-meta.json
      - name: Run real Customer browser E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_EMAIL: customer-a@test.local
          E2E_PASSWORD: AghbariE2E!2026
          E2E_EMAIL_B: customer-b@test.local
          E2E_PASSWORD_B: AghbariE2E!2026
        run: npx playwright test e2e/critical-path.spec.ts --project=chromium
      - name: Run real Admin browser E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_ADMIN_EMAIL: admin-a@test.local
          E2E_ADMIN_PASSWORD: AghbariE2E!2026
        run: npx playwright test e2e/admin-control-plane.spec.ts --project=chromium
      - name: Storage adversarial runtime against fresh local Supabase
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          import base64
          open('/tmp/1x1.webp','wb').write(base64.b64decode('UklGRiIAAABXRUJQVlA4IBYAAAAwAQCdASoBAAEAAQAcJaQAA3AA/vuUAAA='))
          PY

          decode_claims() {
            printf '%s' "$1" | python3 -c 'import base64,json,sys; p=sys.stdin.read().strip().split(".")[1]; p += "="*((4-len(p)%4)%4); d=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:d.get(k) for k in ("sub","role")},sort_keys=True))'
          }

          TA="$(curl -fsS "$VITE_SUPABASE_URL/auth/v1/token?grant_type=password" -H "apikey: $LOCAL_ANON_KEY" -H 'Content-Type: application/json' --data '{"email":"admin-a@test.local","password":"AghbariE2E!2026"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          TB="$(curl -fsS "$VITE_SUPABASE_URL/auth/v1/token?grant_type=password" -H "apikey: $LOCAL_ANON_KEY" -H 'Content-Type: application/json' --data '{"email":"admin-b@test.local","password":"AghbariE2E!2026"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"

          echo "STORAGE_AUTH_A_CLAIMS=$(decode_claims "$TA")"
          echo "STORAGE_AUTH_B_CLAIMS=$(decode_claims "$TB")"

          PATH_A='90000000-0000-4000-8000-000000000101/90000000-0000-4000-8000-000000000501/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa.webp'
          FORGED='90000000-0000-4000-8000-000000000101/90000000-0000-4000-8000-000000000502/cccccccc-cccc-4ccc-8ccc-cccccccccccc.webp'
          INACTIVE='90000000-0000-4000-8000-000000000101/90000000-0000-4000-8000-000000000503/dddddddd-dddd-4ddd-8ddd-dddddddddddd.webp'

          run_curl() {
            IDX="$1"
            LABEL="$2"
            METHOD="$3"
            OBJECT_PATH="$4"
            shift 4
            rm -f /tmp/storage.headers /tmp/storage.body /tmp/storage.curlerr
            set +e
            HTTP_STATUS="$(curl -sS -D /tmp/storage.headers -o /tmp/storage.body -w '%{http_code}' -X "$METHOD" "$VITE_SUPABASE_URL/storage/v1/object/product-media/$OBJECT_PATH" -H "apikey: $LOCAL_ANON_KEY" "$@" 2>/tmp/storage.curlerr)"
            CURL_RC="$?"
            set -e
            echo "STORAGE_REQUEST index=$IDX label=$LABEL method=$METHOD curl_rc=$CURL_RC http_status=$HTTP_STATUS"
            echo "STORAGE_RESPONSE_HEADERS_BEGIN"
            awk 'BEGIN{IGNORECASE=1} /^HTTP\\// || /^(content-type|content-length|cache-control|date|server|x-request-id|x-storage-)/ {print}' /tmp/storage.headers 2>/dev/null || true
            echo "STORAGE_RESPONSE_HEADERS_END"
            echo "STORAGE_RESPONSE_BODY_BEGIN"
            CONTENT_TYPE="$(awk 'BEGIN{IGNORECASE=1} /^Content-Type:/ {sub(/^Content-Type:[[:space:]]*/,""); print tolower($0)}' /tmp/storage.headers 2>/dev/null | tr -d '\\r' | head -1 || true)"
            if [[ "$CONTENT_TYPE" == image/* && "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
              echo "<binary-success-payload-suppressed>"
            else
              python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/storage.body')
          try:
              raw=p.read_bytes()[:2000]
              print(raw.decode('utf-8','replace'))
          except Exception as e:
              print(f'<body-read-error:{e}>')
          PY
            fi
            echo "STORAGE_RESPONSE_BODY_END"
            if [[ -s /tmp/storage.curlerr ]]; then
              echo "STORAGE_CURL_STDERR_BEGIN"
              head -c 2000 /tmp/storage.curlerr || true
              echo
              echo "STORAGE_CURL_STDERR_END"
            fi
          }

          dump_failure_context() {
            echo "STORAGE_FAILURE_CONTEXT_BEGIN"
            echo "DB_CONTEXT_A"
            psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -Atc "begin; set local role authenticated; set local request.jwt.claim.sub='11111111-1111-4111-8111-111111111111'; select public.current_organization_id(),public.current_role(),public.is_staff(); rollback;" 2>&1 || true
            echo "DB_CONTEXT_B"
            psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -Atc "begin; set local role authenticated; set local request.jwt.claim.sub='22222222-2222-4222-8222-222222222222'; select public.current_organization_id(),public.current_role(),public.is_staff(); rollback;" 2>&1 || true
            echo "STORAGE_CONTAINER_LOGS_BEGIN"
            for C in $(docker ps -a --format '{{.Names}}' | grep -Ei 'storage' | head -3); do
              echo "CONTAINER=$C"
              docker logs --tail 200 "$C" 2>&1 | grep -Ei 'error|warn|denied|forbidden|permission|policy|jwt|object|upload|delete|select' | tail -140 || true
            done
            echo "STORAGE_CONTAINER_LOGS_END"
            echo "STORAGE_FAILURE_CONTEXT_END"
          }

          expect_status() {
            IDX="$1"
            LABEL="$2"
            EXPECTED="$3"
            if [[ "$CURL_RC" != "0" || ! "$HTTP_STATUS" =~ $EXPECTED ]]; then
              echo "STORAGE_ASSERTION_FAILED index=$IDX label=$LABEL expected=$EXPECTED actual=$HTTP_STATUS curl_rc=$CURL_RC"
              dump_failure_context
              exit 1
            fi
          }

          run_curl "1" "valid-own-create" POST "$PATH_A" -H "Authorization: Bearer $TA" -H 'Content-Type: image/webp' --data-binary @/tmp/1x1.webp
          expect_status "1" "valid-own-create" '^20[01]$'

          run_curl "2" "valid-own-read" GET "$PATH_A" -H "Authorization: Bearer $TA"
          expect_status "2" "valid-own-read" '^2[0-9][0-9]$'

          run_curl "3" "cross-user-read" GET "$PATH_A" -H "Authorization: Bearer $TB"
          expect_status "3" "cross-user-read" '^[^2].*$'

          run_curl "4" "cross-user-delete" DELETE "$PATH_A" -H "Authorization: Bearer $TB"
          expect_status "4" "cross-user-delete" '^[^2].*$'

          run_curl "5" "cross-user-upsert" POST "$PATH_A" -H "Authorization: Bearer $TB" -H 'Content-Type: image/webp' -H 'x-upsert: true' --data-binary @/tmp/1x1.webp
          expect_status "5" "cross-user-upsert" '^[^2].*$'

          run_curl "6" "forged-product-path" POST "$FORGED" -H "Authorization: Bearer $TA" -H 'Content-Type: image/webp' --data-binary @/tmp/1x1.webp
          expect_status "6" "forged-product-path" '^[^2].*$'

          run_curl "7" "inactive-product-create" POST "$INACTIVE" -H "Authorization: Bearer $TA" -H 'Content-Type: image/webp' --data-binary @/tmp/1x1.webp
          expect_status "7" "inactive-product-create" '^20[01]$'

          run_curl "8" "inactive-product-read" GET "$INACTIVE" -H "Authorization: Bearer $TA"
          expect_status "8" "inactive-product-read" '^[^2].*$'

          run_curl "9" "invalid-filename" POST "90000000-0000-4000-8000-000000000101/90000000-0000-4000-8000-000000000501/not-a-uuid.webp" -H "Authorization: Bearer $TA" -H 'Content-Type: image/webp' --data-binary @/tmp/1x1.webp
          expect_status "9" "invalid-filename" '^[^2].*$'

          run_curl "10" "unauthenticated-create" POST "$PATH_A" -H 'Content-Type: image/webp' --data-binary @/tmp/1x1.webp
          expect_status "10" "unauthenticated-create" '^[^2].*$'

          run_curl "11" "valid-own-delete" DELETE "$PATH_A" -H "Authorization: Bearer $TA"
          expect_status "11" "valid-own-delete" '^20[04]$'
      - name: Stop fresh local Supabase
        if: always()
        run: supabase stop --no-backup
