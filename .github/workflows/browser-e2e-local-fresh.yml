name: Browser E2E / Fresh Local Supabase

on:
  push:
    branches:
      - 'execution/**'
      - 'enhancement/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      exact_sha:
        description: 'Exact Git SHA to verify'
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ inputs.exact_sha || github.event.pull_request.head.sha || github.sha }}
  VITE_BUILD_SHA: ${{ inputs.exact_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  fresh-local-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate exact SHA
        run: echo "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Clean install
        run: |
          rm -rf node_modules dist playwright-report test-results
          npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start fresh local Supabase
        run: supabase start
      - name: Load local Supabase connection values
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase.env
          source /tmp/supabase.env
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "LOCAL_DB_URL=$DB_URL"
            echo "LOCAL_ANON_KEY=$ANON_KEY"
            echo "LOCAL_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Seed fresh browser fixtures
        shell: bash
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
          create_user() {
            local email="$1"
            local body
            body="$(printf '{"email":"%s","password":"AghbariE2E!2026","email_confirm":true,"user_metadata":{}}' "$email")"
            code="$(curl -sS -o /tmp/auth-user.out -w '%{http_code}' -X POST "$VITE_SUPABASE_URL/auth/v1/admin/users" -H "apikey: $LOCAL_SERVICE_ROLE_KEY" -H "Authorization: Bearer $LOCAL_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' --data "$body")"
            [[ "$code" =~ ^2[0-9][0-9]$ ]] || { cat /tmp/auth-user.out; exit 1; }
          }
          create_user customer-a@test.local
          create_user customer-b@test.local
          create_user admin-a@test.local
          create_user admin-b@test.local
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f scripts/browser-e2e-seed.sql
      - name: Production build with local test-only environment
        run: npm run build
      - name: Verify exact artifact identity
        shell: bash
        run: |
          test -s dist/build-meta.json
          node -e "const m=require('./dist/build-meta.json'); if(m.product!=='aghbari-commerce'||m.git_sha!==process.env.EXPECTED_SHA) process.exit(1); console.log(m)"
          sha256sum dist/build-meta.json
      - name: Start production preview
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/build-meta.json >/tmp/served-meta.json && break || sleep 1; done
          diff -u dist/build-meta.json /tmp/served-meta.json
      - name: Run real Customer browser E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_EMAIL: customer-a@test.local
          E2E_PASSWORD: AghbariE2E!2026
          E2E_EMAIL_B: customer-b@test.local
          E2E_PASSWORD_B: AghbariE2E!2026
        run: npx playwright test e2e/critical-path.spec.ts --project=chromium
      - name: Run real Admin browser E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_ADMIN_EMAIL: admin-a@test.local
          E2E_ADMIN_PASSWORD: AghbariE2E!2026
        run: npx playwright test e2e/admin-control-plane.spec.ts --project=chromium
      - name: Storage adversarial runtime against fresh local Supabase
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          open('/tmp/1x1.webp','wb').write(base64.b64decode('UklGRiIAAABXRUJQVlA4IBYAAAAwAQCdASoBAAEAAQAcJaQAA3AA/vuUAAA='))
          PY
          TA="$(curl -fsS "$VITE_SUPABASE_URL/auth/v1/token?grant_type=password" -H "apikey: $LOCAL_ANON_KEY" -H 'Content-Type: application/json' --data '{"email":"admin-a@test.local","password":"AghbariE2E!2026"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          TB="$(curl -fsS "$VITE_SUPABASE_URL/auth/v1/token?grant_type=password" -H "apikey: $LOCAL_ANON_KEY" -H 'Content-Type: application/json' --data '{"email":"admin-b@test.local","password":"AghbariE2E!2026"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          PATH_A='90000000-0000-4000-8000-000000000101/90000000-0000-4000-8000-000000000501/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa.webp'
          FORGED='90000000-0000-4000-8000-000000000101/90000000-0000-4000-8000-000000000502/cccccccc-cccc-4ccc-8ccc-cccccccccccc.webp'
          INACTIVE='90000000-0000-4000-8000-000000000101/90000000-0000-4000-8000-000000000503/dddddddd-dddd-4ddd-8ddd-dddddddddddd.webp'
          put() { curl -sS -o /tmp/storage.out -w '%{http_code}' -X POST "$VITE_SUPABASE_URL/storage/v1/object/product-media/$1" -H "apikey: $LOCAL_ANON_KEY" -H "Authorization: Bearer $2" -H 'Content-Type: image/webp' --data-binary @/tmp/1x1.webp; }
          get() { curl -sS -o /tmp/storage-read -w '%{http_code}' "$VITE_SUPABASE_URL/storage/v1/object/product-media/$1" -H "apikey: $LOCAL_ANON_KEY" -H "Authorization: Bearer $2"; }
          del() { curl -sS -o /tmp/storage.out -w '%{http_code}' -X DELETE "$VITE_SUPABASE_URL/storage/v1/object/product-media/$1" -H "apikey: $LOCAL_ANON_KEY" -H "Authorization: Bearer $2"; }
          code="$(put "$PATH_A" "$TA")"; [[ "$code" =~ ^20[01]$ ]] || exit 1
          code="$(get "$PATH_A" "$TA")"; [[ "$code" =~ ^2[0-9][0-9]$ ]] || exit 1
          code="$(get "$PATH_A" "$TB")"; [[ ! "$code" =~ ^2[0-9][0-9]$ ]] || exit 1
          code="$(del "$PATH_A" "$TB")"; [[ ! "$code" =~ ^2[0-9][0-9]$ ]] || exit 1
          code="$(curl -sS -o /tmp/storage.out -w '%{http_code}' -X POST "$VITE_SUPABASE_URL/storage/v1/object/product-media/$PATH_A" -H "apikey: $LOCAL_ANON_KEY" -H "Authorization: Bearer $TB" -H 'Content-Type: image/webp' -H 'x-upsert: true' --data-binary @/tmp/1x1.webp)"; [[ ! "$code" =~ ^2[0-9][0-9]$ ]] || exit 1
          code="$(put "$FORGED" "$TA")"; [[ ! "$code" =~ ^2[0-9][0-9]$ ]] || exit 1
          code="$(put "$INACTIVE" "$TA")"; [[ "$code" =~ ^20[01]$ ]] || exit 1
          code="$(get "$INACTIVE" "$TA")"; [[ ! "$code" =~ ^2[0-9][0-9]$ ]] || exit 1
          code="$(curl -sS -o /tmp/storage.out -w '%{http_code}' -X POST "$VITE_SUPABASE_URL/storage/v1/object/product-media/90000000-0000-4000-8000-000000000101/90000000-0000-4000-8000-000000000501/not-a-uuid.webp" -H "apikey: $LOCAL_ANON_KEY" -H "Authorization: Bearer $TA" -H 'Content-Type: image/webp' --data-binary @/tmp/1x1.webp)"; [[ ! "$code" =~ ^2[0-9][0-9]$ ]] || exit 1
          code="$(curl -sS -o /tmp/storage.out -w '%{http_code}' -X POST "$VITE_SUPABASE_URL/storage/v1/object/product-media/$PATH_A" -H "apikey: $LOCAL_ANON_KEY" -H 'Content-Type: image/webp' --data-binary @/tmp/1x1.webp)"; [[ ! "$code" =~ ^2[0-9][0-9]$ ]] || exit 1
          code="$(del "$PATH_A" "$TA")"; [[ "$code" =~ ^20[04]$ ]] || exit 1
      - name: Stop fresh local Supabase
        if: always()
        run: supabase stop --no-backup
