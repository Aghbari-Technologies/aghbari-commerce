name: Netlify Exact-Source Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      exact_sha:
        description: 'Exact Git SHA to deploy'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aghbari-netlify-exact-${{ inputs.exact_sha || github.sha }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ inputs.exact_sha || github.sha }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 6c515d48-3385-46eb-958c-3ff2ee17e95e
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Require Netlify deploy credential
        shell: bash
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || {
            echo 'BLOCKED: NETLIFY_AUTH_TOKEN is not configured.'
            exit 1
          }

      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Verify exact source
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA" || {
            echo "SHA MISMATCH: expected=$TARGET_SHA actual=$actual"
            exit 1
          }
          echo "EXACT SOURCE SHA: $actual"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build exact deploy artifact
        run: npm run build

      - name: Verify exact artifact identity
        shell: bash
        run: |
          node -e "const m=require('./dist/build-meta.json'); if(m.product!=='aghbari-commerce'||m.git_sha!==process.env.TARGET_SHA) { console.error(m); process.exit(1) }"
          test -f dist/index.html
          echo "EXACT ARTIFACT SHA: $TARGET_SHA"

      - name: Deploy exact artifact to Netlify
        run: npx --yes netlify-cli@23 deploy --prod --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="aghbari exact source $TARGET_SHA"

      - name: Record exact deployment identity
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 20             "https://aghbari-commerce-web.netlify.app/build-meta.json?exact_sha=$TARGET_SHA"             -o served-build-meta.json
          node -e "const m=require('./served-build-meta.json'); if(m.product!=='aghbari-commerce'||m.git_sha!==process.env.TARGET_SHA) { console.error(m); process.exit(1) }; console.log('DEPLOYED EXACT SHA:',m.git_sha)"
