name: Security / Gitleaks

on:
  push:
    branches:
      - main
      - 'execution/**'
      - 'ops/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record exact checkout SHA
        id: sha
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "EXACT CHECKED-OUT SHA: $actual"

      - name: Run Gitleaks
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path /repo/gitleaks.sarif

      - name: Upload redacted Gitleaks evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitleaks-${{ steps.sha.outputs.sha }}
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove local scan report
        if: always()
        shell: bash
        run: rm -f gitleaks.sarif
